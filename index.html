<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>畫幅對照尺</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* 版面：左側輸入與數值，右側以比例縮小的螢幕示意圖，手機上直向堆疊 */
  :root {
    --bg: #f0f2f5;
    --surface: #fafbfc;
    --stage: #e6e9ee;
    --line: #d3d8e0;
    --line-strong: #8a94a3;
    --fg: #14181e;
    --muted: #586272;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --box-fill: #d9e3ff;
    --screen-fill: #f7f8fa;
    --hatch: #cfd5de;
    --warn: #b4531a;
    --overlay: #0c0f14;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116;
      --surface: #151a21;
      --stage: #0b0e13;
      --line: #28303a;
      --line-strong: #6b7686;
      --fg: #e7ebf0;
      --muted: #93a0b0;
      --accent: #7d9bff;
      --accent-ink: #0b1228;
      --box-fill: #1d2a55;
      --screen-fill: #171d26;
      --hatch: #232b36;
      --warn: #e59a63;
      --overlay: #05070a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116;
    --surface: #151a21;
    --stage: #0b0e13;
    --line: #28303a;
    --line-strong: #6b7686;
    --fg: #e7ebf0;
    --muted: #93a0b0;
    --accent: #7d9bff;
    --accent-ink: #0b1228;
    --box-fill: #1d2a55;
    --screen-fill: #171d26;
    --hatch: #232b36;
    --warn: #e59a63;
    --overlay: #05070a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: grid;
    gap: 20px 28px;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 880px) {
    .wrap {
      grid-template-columns: 380px minmax(0, 1fr);
      grid-template-areas:
        "head head"
        "controls stage"
        "readouts stage";
      align-items: start;
    }
    header { grid-area: head; }
    .controls { grid-area: controls; }
    .readouts { grid-area: readouts; }
    .stagewrap { grid-area: stage; position: sticky; top: 16px; }
  }

  header h1 {
    margin: 0;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .lede { margin: 4px 0 0; color: var(--muted); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    min-width: 0;
  }
  label, .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    font: 500 22px/1.2 var(--font-mono);
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 11px 12px;
    min-width: 0;
  }
  input[type="number"] { font-size: 16px; padding: 8px 10px; }
  input:focus-visible, button:focus-visible, summary:focus-visible, .seg input:focus-visible + span {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .msg { min-height: 1.5em; margin: 6px 0 0; font-size: 13px; color: var(--warn); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 10px; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .seg label { margin: 0; position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; }
  .seg span {
    display: block;
    text-align: center;
    padding: 9px 8px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--fg);
    cursor: pointer;
  }
  .seg label + label span { border-left: 1px solid var(--line-strong); }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .seg input:disabled + span { color: var(--muted); cursor: not-allowed; opacity: 0.55; }
  .hint { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }

  .chips-block { margin-top: 16px; display: grid; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    font: 500 13px/1 var(--font-mono);
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .chips button:hover { border-color: var(--line-strong); }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .stage {
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    display: grid;
    place-items: center;
    min-width: 0;
  }
  .frame { position: relative; max-width: 100%; }
  .screen {
    position: absolute;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    background:
      repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 7px),
      var(--screen-fill);
  }
  .box {
    position: absolute;
    display: grid;
    place-items: center;
    background: var(--box-fill);
    border: 2px solid var(--accent);
    font: 500 14px/1 var(--font-mono);
    color: var(--accent);
    overflow: hidden;
    transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease;
  }
  .box.over { border-style: dashed; }
  @media (prefers-reduced-motion: reduce) { .box { transition: none; } }

  .legend {
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend li { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .legend i { width: 14px; height: 10px; border-radius: 2px; flex: none; }
  .legend .s { border: 1.5px solid var(--line-strong); background: var(--screen-fill); }
  .legend .b { border: 2px solid var(--accent); background: var(--box-fill); }
  .legend b { font-family: var(--font-mono); font-weight: 500; color: var(--fg); }
  .stage-actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .btn {
    font: 500 14px/1 var(--font-body);
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
  }
  .stage-actions small { color: var(--muted); font-size: 12.5px; }

  .readouts h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
  dl { margin: 0; display: grid; }
  dl > div { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  dl > div:first-child { border-top: 0; padding-top: 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dd.strong { font-size: 16px; font-weight: 500; }

  details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; font-size: 13.5px; color: var(--fg); }
  .diag-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .diag-row input { width: 7em; }
  .diag-row span { color: var(--muted); font-size: 14px; }
  .fine { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }

  .device { font: 400 12.5px/1.7 var(--font-mono); color: var(--muted); margin: 0; overflow-wrap: anywhere; }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--overlay);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  #ovBox {
    display: grid;
    place-items: center;
    text-align: center;
    background: var(--accent);
    color: var(--accent-ink);
    font: 500 clamp(13px, 2.4vw, 20px)/1.5 var(--font-mono);
    padding: 8px;
    overflow: hidden;
  }
  #ovNote {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    color: #9aa6b6;
    font-size: 12.5px;
    pointer-events: none;
  }
</style>

<main class="wrap">
  <header>
    <h1>畫幅對照尺</h1>
    <p class="lede">輸入比例或解析度，看方框在這台裝置上有多大。</p>
  </header>

  <section class="controls panel" aria-label="輸入">
    <label for="spec">比例或解析度</label>
    <input id="spec" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="16:9" placeholder="16:9　或　1920x1080">
    <p id="msg" class="msg" role="status" aria-live="polite"></p>

    <div class="field-label" style="margin-top:6px">顯示方式</div>
    <div class="seg" role="radiogroup" aria-label="顯示方式">
      <label><input type="radio" name="mode" id="modeFit" value="fit" checked><span>符合螢幕</span></label>
      <label><input type="radio" name="mode" id="modeNative" value="native"><span>原始像素</span></label>
    </div>
    <p class="hint" id="modeHint"></p>

    <div class="chips-block">
      <div>
        <div class="field-label">常用比例</div>
        <div class="chips" id="ratioChips"></div>
      </div>
      <div>
        <div class="field-label">常用解析度</div>
        <div class="chips" id="resChips"></div>
      </div>
    </div>
  </section>

  <section class="stagewrap" aria-label="預覽">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <div class="screen" id="screenEl"></div>
        <div class="box" id="boxEl"><span id="boxLabel"></span></div>
      </div>
    </div>
    <ul class="legend">
      <li><i class="s"></i><span>螢幕 <b id="lgScreen"></b></span></li>
      <li><i class="b"></i><span>方框 <b id="lgBox"></b></span></li>
    </ul>
    <div class="stage-actions">
      <button class="btn" id="openPreview" type="button">實際大小預覽</button>
      <small>以目前視窗為準。點一下或按 Esc 關閉。</small>
    </div>
  </section>

  <section class="readouts panel" aria-label="數值">
    <h2>數值</h2>
    <dl id="out"></dl>
    <details id="physical">
      <summary>換算成實際公分（選填）</summary>
      <div class="diag-row">
        <input id="diag" type="number" inputmode="decimal" min="1" max="120" step="0.1" placeholder="11">
        <span>吋（螢幕對角線）</span>
      </div>
      <p class="fine">瀏覽器無法得知螢幕的實體尺寸，填入對角線吋數才能換算。</p>
    </details>
    <p class="device" id="device" style="margin-top:16px"></p>
  </section>
</main>

<div id="overlay" hidden role="dialog" aria-label="實際大小預覽">
  <div id="ovBox"></div>
  <p id="ovNote"></p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var RATIOS = ["16:9", "16:10", "4:3", "3:2", "1:1", "21:9", "2.39:1", "1.85:1", "9:16", "4:5"];
  var RES = ["1920x1080", "2560x1440", "3840x2160", "1080x1920", "1080x1350"];
  var mode = "fit";
  var last = null;

  function R(n) { return Math.round(n).toString(); }
  function P(x) { var v = x * 100; return (v >= 10 ? Math.round(v) : Math.round(v * 10) / 10) + "%"; }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function num(s) { return parseFloat(s); }

  function normalize(s) {
    return s.trim().replace(/[×✕＊*]/g, "x").replace(/[：∶]/g, ":").replace(/／/g, "/").replace(/\s*([xX:\/])\s*/g, "$1");
  }

  function parse(raw) {
    var s = normalize(raw);
    if (!s) return { err: "請輸入比例（例如 16:9）或解析度（例如 1920x1080）。" };
    var m, a, b;
    if ((m = s.match(/^(\d+(?:\.\d+)?)[:\/](\d+(?:\.\d+)?)$/))) {
      a = num(m[1]); b = num(m[2]);
      return ratioResult(a, b, m[1] + ":" + m[2]);
    }
    if ((m = s.match(/^(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)$/i))) {
      a = num(m[1]); b = num(m[2]);
      if (a >= 100 && b >= 100 && Number.isInteger(a) && Number.isInteger(b)) {
        var g = gcd(a, b), rw = a / g, rh = b / g;
        var label = (rw <= 50 && rh <= 50) ? rw + ":" + rh : (a / b).toFixed(2) + ":1";
        return { kind: "res", w: a, h: b, r: a / b, label: label };
      }
      return ratioResult(a, b, m[1] + ":" + m[2]);
    }
    if ((m = s.match(/^(\d+(?:\.\d+)?)$/))) {
      a = num(m[1]);
      if (a >= 100) return { err: "解析度需要寬和高，例如 " + a + "x1080。" };
      return ratioResult(a, 1, m[1] + ":1");
    }
    return { err: "格式看不懂。可以輸入 16:9、2.39、1920x1080。" };
  }
  function ratioResult(a, b, label) {
    if (!(a > 0 && b > 0)) return { err: "數字需要大於 0。" };
    var r = a / b;
    if (r < 0.1 || r > 10) return { err: "這個比例太極端，請輸入 1:10 到 10:1 之間。" };
    return { kind: "ratio", r: r, label: label };
  }

  function device() {
    var sw = screen.width, sh = screen.height;
    var land = innerWidth > innerHeight;
    var coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    if (coarse && (sw > sh) !== land) { var t = sw; sw = sh; sh = t; }
    return { sw: sw, sh: sh, dpr: window.devicePixelRatio || 1, vw: innerWidth, vh: innerHeight };
  }

  function compute(p, d, eff) {
    var bw, bh;
    if (eff === "native") { bw = p.w / d.dpr; bh = p.h / d.dpr; }
    else { bw = Math.min(d.sw, d.sh * p.r); bh = bw / p.r; }
    return { bw: bw, bh: bh };
  }

  function edgeText(bw, bh, sw, sh) {
    var parts = [], over = false, e = 0.5, g;
    g = (sw - bw) / 2;
    if (g > e) parts.push("左右各留 " + R(g)); else if (g < -e) { parts.push("左右各超出 " + R(-g)); over = true; }
    g = (sh - bh) / 2;
    if (g > e) parts.push("上下各留 " + R(g)); else if (g < -e) { parts.push("上下各超出 " + R(-g)); over = true; }
    return { text: parts.length ? parts.join("，") : "剛好填滿螢幕", over: over };
  }

  function physicalLine(bw, bh, d) {
    var diag = num($("diag").value);
    if (!(diag > 0)) return null;
    var ppi = Math.hypot(d.sw * d.dpr, d.sh * d.dpr) / diag;
    var wi = bw * d.dpr / ppi, hi = bh * d.dpr / ppi;
    var f = function (n) { return (Math.round(n * 10) / 10).toFixed(1); };
    return "約 " + f(wi * 2.54) + " × " + f(hi * 2.54) + " 公分（" + f(wi) + " × " + f(hi) + " 吋）";
  }

  function render() {
    var d = device();
    var raw = $("spec").value;
    var p = parse(raw);
    var msg = $("msg");
    if (p.err) {
      msg.textContent = p.err;
      if (!last) return;
      p = last.p;
    } else {
      msg.textContent = "";
    }
    var isRes = p.kind === "res";
    $("modeNative").disabled = !isRes;
    var eff = (mode === "native" && isRes) ? "native" : "fit";
    $("modeFit").checked = eff === "fit";
    $("modeNative").checked = eff === "native";
    $("modeHint").textContent = isRes
      ? (eff === "native" ? "1 個輸入像素 = 1 個裝置像素，顯示這個解析度在螢幕上實際占多大。" : "把這個比例放大到剛好放進螢幕。")
      : "把這個比例放大到剛好放進螢幕。輸入解析度（如 1920x1080）才能用原始像素。";

    var c = compute(p, d, eff);
    var bw = c.bw, bh = c.bh;
    last = { p: p };

    // 示意圖
    var extW = Math.max(d.sw, bw), extH = Math.max(d.sh, bh);
    var stage = $("stage");
    var availW = Math.max(120, stage.clientWidth - 40);
    var availH = Math.max(220, Math.min(innerHeight * 0.5, 440));
    var k = Math.min(availW / extW, availH / extH);
    var fw = extW * k, fh = extH * k;
    var frame = $("frame");
    frame.style.width = fw + "px";
    frame.style.height = fh + "px";
    var sc = $("screenEl"), bx = $("boxEl");
    sc.style.left = ((extW - d.sw) / 2 * k) + "px";
    sc.style.top = ((extH - d.sh) / 2 * k) + "px";
    sc.style.width = (d.sw * k) + "px";
    sc.style.height = (d.sh * k) + "px";
    bx.style.left = ((extW - bw) / 2 * k) + "px";
    bx.style.top = ((extH - bh) / 2 * k) + "px";
    bx.style.width = (bw * k) + "px";
    bx.style.height = (bh * k) + "px";
    var edge = edgeText(bw, bh, d.sw, d.sh);
    bx.classList.toggle("over", edge.over);
    $("boxLabel").textContent = bw * k > 52 && bh * k > 24 ? p.label : "";

    $("lgScreen").textContent = R(d.sw) + " × " + R(d.sh);
    $("lgBox").textContent = R(bw) + " × " + R(bh);

    // 數值
    var rows = [];
    rows.push(["方框 CSS 像素", R(bw) + " × " + R(bh), true]);
    rows.push(["方框 裝置像素", R(bw * d.dpr) + " × " + R(bh * d.dpr), true]);
    rows.push(["占螢幕", "寬 " + P(bw / d.sw) + " · 高 " + P(bh / d.sh)]);
    rows.push(["占面積", P(Math.min(bw, d.sw) * Math.min(bh, d.sh) / (d.sw * d.sh))]);
    rows.push([edge.over ? "超出螢幕" : "黑邊", edge.text]);
    rows.push(["寬高比", p.r.toFixed(3) + " : 1"]);
    if (isRes && eff === "fit") {
      var sc2 = bw * d.dpr / p.w;
      rows.push(["對照輸入", (sc2 <= 1 ? "縮小為 " : "放大為 ") + P(sc2) + "（" + p.w + "×" + p.h + "）"]);
    }
    var phys = physicalLine(bw, bh, d);
    if (phys) rows.push(["實際尺寸", phys]);
    $("out").innerHTML = rows.map(function (r) {
      return "<div><dt>" + r[0] + "</dt><dd" + (r[2] ? ' class="strong"' : "") + ">" + r[1] + "</dd></div>";
    }).join("");

    // 裝置資訊
    $("device").textContent =
      "螢幕 " + R(d.sw) + "×" + R(d.sh) + " CSS 像素 · 像素比 " + (Math.round(d.dpr * 100) / 100) +
      " · 原生 " + R(d.sw * d.dpr) + "×" + R(d.sh * d.dpr) + " · 視窗 " + d.vw + "×" + d.vh;

    markChips(raw);
    last.d = d; last.eff = eff;
  }

  function markChips(raw) {
    var n = normalize(raw).toLowerCase();
    var btns = document.querySelectorAll(".chips button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", normalize(btns[i].dataset.v).toLowerCase() === n ? "true" : "false");
    }
  }

  function buildChips(id, list) {
    var host = $(id);
    list.forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.v = v;
      b.textContent = v.replace("x", "×");
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () {
        $("spec").value = v;
        render();
      });
      host.appendChild(b);
    });
  }

  // 實際大小預覽
  function openOverlay() {
    render();
    if (!last) return;
    var p = last.p, d = device();
    var vw = innerWidth, vh = innerHeight;
    var w, h, note;
    if (last.eff === "native") {
      w = p.w / d.dpr; h = p.h / d.dpr;
      var s = Math.min(1, vw / w, vh / h);
      if (s < 1) { w *= s; h *= s; note = "這個解析度比視窗大，已縮小為 " + P(s) + " 顯示"; }
      else note = "原始像素大小";
    } else {
      w = Math.min(vw, vh * p.r); h = w / p.r;
      note = "符合視窗的最大方框";
    }
    var ov = $("ovBox");
    ov.style.width = w + "px";
    ov.style.height = h + "px";
    ov.textContent = "";
    var l1 = document.createElement("div"); l1.textContent = p.label;
    var l2 = document.createElement("div"); l2.textContent = R(w) + " × " + R(h) + " CSS 像素";
    ov.appendChild(l1); ov.appendChild(l2);
    $("ovNote").textContent = note + " · 點一下關閉";
    $("overlay").hidden = false;
  }
  function closeOverlay() { $("overlay").hidden = true; }

  buildChips("ratioChips", RATIOS);
  buildChips("resChips", RES);

  $("spec").addEventListener("input", render);
  document.querySelectorAll('input[name="mode"]').forEach(function (r) {
    r.addEventListener("change", function () { mode = r.value; render(); });
  });
  $("diag").addEventListener("input", function () {
    try { localStorage.setItem("aspect-diag", $("diag").value); } catch (e) {}
    render();
  });
  $("openPreview").addEventListener("click", openOverlay);
  $("overlay").addEventListener("click", closeOverlay);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeOverlay(); });
  window.addEventListener("resize", function () { if ($("overlay").hidden) render(); else closeOverlay(); });

  try {
    var saved = localStorage.getItem("aspect-diag");
    if (saved) { $("diag").value = saved; $("physical").open = true; }
  } catch (e) {}

  render();
})();
</script>

</body></html>
