<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>畫幅對照尺</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* 版面：左側輸入與數值，右側以比例縮小的螢幕示意圖，手機上直向堆疊 */
  :root {
    --bg: #f0f2f5;
    --surface: #fafbfc;
    --stage: #e6e9ee;
    --line: #d3d8e0;
    --line-strong: #8a94a3;
    --fg: #14181e;
    --muted: #586272;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --box-fill: #d9e3ff;
    --screen-fill: #f7f8fa;
    --hatch: #cfd5de;
    --warn: #b4531a;
    --overlay: #0c0f14;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116;
      --surface: #151a21;
      --stage: #0b0e13;
      --line: #28303a;
      --line-strong: #6b7686;
      --fg: #e7ebf0;
      --muted: #93a0b0;
      --accent: #7d9bff;
      --accent-ink: #0b1228;
      --box-fill: #1d2a55;
      --screen-fill: #171d26;
      --hatch: #232b36;
      --warn: #e59a63;
      --overlay: #05070a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116;
    --surface: #151a21;
    --stage: #0b0e13;
    --line: #28303a;
    --line-strong: #6b7686;
    --fg: #e7ebf0;
    --muted: #93a0b0;
    --accent: #7d9bff;
    --accent-ink: #0b1228;
    --box-fill: #1d2a55;
    --screen-fill: #171d26;
    --hatch: #232b36;
    --warn: #e59a63;
    --overlay: #05070a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap {
    max-width: 1060px;
    margin: 0 auto;
    display: grid;
    gap: 20px 28px;
    grid-template-columns: minmax(0, 1fr);
  }
  @media (min-width: 880px) {
    .wrap {
      grid-template-columns: 380px minmax(0, 1fr);
      grid-template-areas:
        "controls stage"
        "readouts stage";
      align-items: start;
    }
    .controls { grid-area: controls; }
    .readouts { grid-area: readouts; }
    .stagewrap { grid-area: stage; position: sticky; top: 16px; }
  }

  header h1 {
    margin: 0;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .lede { margin: 4px 0 0; color: var(--muted); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    min-width: 0;
  }
  label, .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    font: 500 22px/1.2 var(--font-mono);
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 11px 12px;
    min-width: 0;
  }
  input[type="number"] { font-size: 16px; padding: 8px 10px; }
  input:focus-visible, button:focus-visible, summary:focus-visible, .seg input:focus-visible + span {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .msg { min-height: 1.5em; margin: 6px 0 0; font-size: 13px; color: var(--warn); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 10px; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .seg label { margin: 0; position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; }
  .seg span {
    display: block;
    text-align: center;
    padding: 9px 8px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--fg);
    cursor: pointer;
  }
  .seg label + label span { border-left: 1px solid var(--line-strong); }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .seg input:disabled + span { color: var(--muted); cursor: not-allowed; opacity: 0.55; }
  .hint { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
  .screen-block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .screen-block .seg { margin-top: 0; }
  #manualFields { margin-top: 12px; }
  #manualFields label { margin-top: 10px; }
  #manualFields label:first-child { margin-top: 0; }
  #manualFields input[type="number"] { width: 8em; }
  #manualFields .msg { min-height: 0; margin-top: 8px; }

  .chips-block { margin-top: 16px; display: grid; gap: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    font: 500 13px/1 var(--font-mono);
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .chips button:hover { border-color: var(--line-strong); }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .stage {
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    display: grid;
    place-items: center;
    min-width: 0;
  }
  .frame { position: relative; max-width: 100%; }
  .screen {
    position: absolute;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    background:
      repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 7px),
      var(--screen-fill);
  }
  .box {
    position: absolute;
    display: grid;
    place-items: center;
    background: var(--box-fill);
    border: 2px solid var(--accent);
    font: 500 14px/1 var(--font-mono);
    color: var(--accent);
    overflow: hidden;
    transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease;
  }
  .box.over { border-style: dashed; }
  @media (prefers-reduced-motion: reduce) { .box { transition: none; } }

  .legend {
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend li { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .legend i { width: 14px; height: 10px; border-radius: 2px; flex: none; }
  .legend .s { border: 1.5px solid var(--line-strong); background: var(--screen-fill); }
  .legend .b { border: 2px solid var(--accent); background: var(--box-fill); }
  .legend b { font-family: var(--font-mono); font-weight: 500; color: var(--fg); }
  .stage-actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .btn {
    font: 500 14px/1 var(--font-body);
    color: var(--accent-ink);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
  }
  .stage-actions small { color: var(--muted); font-size: 12.5px; }

  .readouts h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
  dl { margin: 0; display: grid; }
  dl > div { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  dl > div:first-child { border-top: 0; padding-top: 0; }
  dt { color: var(--muted); font-size: 13px; }
  dd { margin: 0; font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dd.strong { font-size: 16px; font-weight: 500; }

  details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; font-size: 13.5px; color: var(--fg); }
  .diag-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .diag-row input { width: 7em; }
  .diag-row span { color: var(--muted); font-size: 14px; }
  .fine { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }

  .device { font: 400 12.5px/1.7 var(--font-mono); color: var(--muted); margin: 0; overflow-wrap: anywhere; }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--overlay);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  #ovBox {
    display: grid;
    place-items: center;
    text-align: center;
    background: var(--accent);
    color: var(--accent-ink);
    font: 500 clamp(13px, 2.4vw, 20px)/1.5 var(--font-mono);
    padding: 8px;
    overflow: hidden;
  }
  #ovNote {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    color: #9aa6b6;
    font-size: 12.5px;
    pointer-events: none;
  }
</style>
<style>
  /* 影片 × 銀幕：兩個半透明方框疊在一起，橘色是影片，青色是銀幕 */
  :root {
    --film: #c2410c;
    --film-fill: rgba(234, 88, 12, 0.40);
    --scr: #0f766e;
    --scr-fill: rgba(20, 184, 166, 0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --film: #ffa05c;
      --film-fill: rgba(255, 140, 60, 0.38);
      --scr: #4fd1c0;
      --scr-fill: rgba(60, 200, 180, 0.22);
    }
  }
  :root[data-theme="dark"] {
    --film: #ffa05c;
    --film-fill: rgba(255, 140, 60, 0.38);
    --scr: #4fd1c0;
    --scr-fill: rgba(60, 200, 180, 0.22);
  }
  .top { max-width: 1060px; margin: 0 auto 20px; display: grid; gap: 14px; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
  .tabs button {
    font: 500 14px/1 var(--font-body);
    color: var(--muted);
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    padding: 10px 14px;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .tabs button[aria-current="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .seg4 { background: var(--line-strong); gap: 1px; }
  .seg4 span { background: var(--surface); }
  .seg4 label + label span { border-left: 0; }
  .seg4 input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .c-screen, .c-film {
    position: absolute;
    transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease;
  }
  .c-screen { background: var(--scr-fill); outline: 2px dashed var(--scr); outline-offset: 3px; }
  .c-film { background: var(--film-fill); border: 2px solid var(--film); }
  .c-tag { position: absolute; font: 500 12px/1 var(--font-mono); white-space: nowrap; pointer-events: none; }
  .c-screen .c-tag { left: 8px; top: 8px; color: var(--scr); }
  .c-film .c-tag { right: 8px; bottom: 8px; color: var(--film); }
  @media (prefers-reduced-motion: reduce) { .c-screen, .c-film { transition: none; } }
  .legend .cs { border: 2px dashed var(--scr); background: var(--scr-fill); }
  .legend .cf { border: 2px solid var(--film); background: var(--film-fill); }
  .cnote { margin: 12px 0 0; font-size: 14px; }
</style>

<div class="top">
  <header>
    <h1>畫幅對照尺</h1>
    <p class="lede" id="lede">輸入比例或解析度，看方框在這台裝置上有多大。</p>
  </header>
  <nav class="tabs" aria-label="功能">
    <button type="button" id="tabScreen" data-tab="screen" aria-current="true">螢幕方框</button>
    <button type="button" id="tabCinema" data-tab="cinema" aria-current="false">影片 × 銀幕</button>
  </nav>
</div>

<main class="wrap" id="viewScreen">

  <section class="controls panel" aria-label="輸入">
    <label for="spec">比例或解析度</label>
    <input id="spec" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="16:9" placeholder="16:9　或　1920x1080">
    <p id="msg" class="msg" role="status" aria-live="polite"></p>

    <div class="field-label" style="margin-top:6px">顯示方式</div>
    <div class="seg" role="radiogroup" aria-label="顯示方式">
      <label><input type="radio" name="mode" id="modeFit" value="fit" checked><span>符合螢幕</span></label>
      <label><input type="radio" name="mode" id="modeNative" value="native"><span>原始像素</span></label>
    </div>
    <p class="hint" id="modeHint"></p>

    <div class="chips-block">
      <div>
        <div class="field-label">常用比例</div>
        <div class="chips" id="ratioChips"></div>
      </div>
      <div>
        <div class="field-label">常用解析度</div>
        <div class="chips" id="resChips"></div>
      </div>
    </div>

    <div class="screen-block">
      <div class="field-label">螢幕大小</div>
      <div class="seg" role="radiogroup" aria-label="螢幕來源">
        <label><input type="radio" name="src" id="srcAuto" value="auto" checked><span>自動偵測</span></label>
        <label><input type="radio" name="src" id="srcManual" value="manual"><span>手動輸入</span></label>
      </div>
      <div id="manualFields" hidden>
        <label for="scrRes">螢幕原生解析度（像素）</label>
        <input id="scrRes" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="2388x1668">
        <label for="scrDpr">像素比（一般螢幕 1，Retina 2 或 3）</label>
        <input id="scrDpr" type="number" inputmode="decimal" min="0.5" max="6" step="0.01" placeholder="2">
        <p id="manualMsg" class="msg" role="status" aria-live="polite"></p>
      </div>
      <p class="hint" id="srcHint"></p>
    </div>
  </section>

  <section class="stagewrap" aria-label="預覽">
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <div class="screen" id="screenEl"></div>
        <div class="box" id="boxEl"><span id="boxLabel"></span></div>
      </div>
    </div>
    <ul class="legend">
      <li><i class="s"></i><span>螢幕 <b id="lgScreen"></b></span></li>
      <li><i class="b"></i><span>方框 <b id="lgBox"></b></span></li>
    </ul>
    <div class="stage-actions">
      <button class="btn" id="openPreview" type="button">實際大小預覽</button>
      <small>以目前視窗為準。點一下或按 Esc 關閉。</small>
    </div>
  </section>

  <section class="readouts panel" aria-label="數值">
    <h2>數值</h2>
    <dl id="out"></dl>
    <details id="physical">
      <summary>換算成實際公分（選填）</summary>
      <div class="diag-row">
        <input id="diag" type="number" inputmode="decimal" min="1" max="120" step="0.1" placeholder="11">
        <span>吋（螢幕對角線）</span>
      </div>
      <p class="fine">瀏覽器無法得知螢幕的實體尺寸，填入對角線吋數才能換算。</p>
    </details>
    <p class="device" id="device" style="margin-top:16px"></p>
  </section>
</main>

<main class="wrap" id="viewCinema" hidden>
  <section class="controls panel" aria-label="影片與銀幕">
    <label for="film">影片畫幅</label>
    <input id="film" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="2.39" placeholder="2.39　或　16:9　或　4096x1716">
    <p id="filmMsg" class="msg" role="status" aria-live="polite"></p>
    <div class="chips" id="filmChips"></div>
    <p class="hint">也可以輸入比例（16:9）或影片解析度（4096x1716）。</p>

    <div class="screen-block">
      <label for="hall">影廳銀幕</label>
      <input id="hall" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="1.43" placeholder="1.43　或　銀幕寬x高　例如 22x12">
      <p id="hallMsg" class="msg" role="status" aria-live="polite"></p>
      <div class="chips" id="hallChips"></div>
      <p class="hint">IMAX 的銀幕比例依影廳不同，常見為 1.43 或 1.90。也可以輸入銀幕實際的寬x高，單位任意（例如公尺），會換算成比例。</p>
    </div>

    <div class="screen-block">
      <div class="field-label">對照方式</div>
      <div class="seg seg4" role="radiogroup" aria-label="對照方式">
        <label><input type="radio" name="cfit" value="fit" checked><span>完整顯示</span></label>
        <label><input type="radio" name="cfit" value="fill"><span>填滿銀幕</span></label>
        <label><input type="radio" name="cfit" value="width"><span>同寬</span></label>
        <label><input type="radio" name="cfit" value="height"><span>同高</span></label>
      </div>
      <p class="hint" id="cfitHint"></p>
    </div>
  </section>

  <section class="stagewrap" aria-label="對照圖">
    <div class="stage" id="cstage">
      <div class="frame" id="cframe">
        <div class="c-screen" id="cScr"><span class="c-tag" id="cTagS"></span></div>
        <div class="c-film" id="cFilm"><span class="c-tag" id="cTagF"></span></div>
      </div>
    </div>
    <ul class="legend">
      <li><i class="cs"></i><span>影廳銀幕 <b id="lgHall"></b></span></li>
      <li><i class="cf"></i><span>影片畫面 <b id="lgFilm"></b></span></li>
    </ul>
    <p class="cnote" id="cNote" aria-live="polite"></p>
  </section>

  <section class="readouts panel" aria-label="對照結果">
    <h2>對照結果</h2>
    <dl id="cout"></dl>
  </section>
</main>

<div id="overlay" hidden role="dialog" aria-label="實際大小預覽">
  <div id="ovBox"></div>
  <p id="ovNote"></p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var RATIOS = ["16:9", "16:10", "4:3", "3:2", "1:1", "21:9", "2.39:1", "1.85:1", "9:16", "4:5"];
  var RES = ["1920x1080", "2560x1440", "3840x2160", "1080x1920", "1080x1350"];
  var mode = "fit";
  var last = null;

  function R(n) { return Math.round(n).toString(); }
  function P(x) { var v = x * 100; return (v >= 10 ? Math.round(v) : Math.round(v * 10) / 10) + "%"; }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function num(s) { return parseFloat(s); }

  function normalize(s) {
    return s.trim().replace(/[×✕＊*]/g, "x").replace(/[：∶]/g, ":").replace(/／/g, "/").replace(/\s*([xX:\/])\s*/g, "$1");
  }

  function parse(raw) {
    var s = normalize(raw);
    if (!s) return { err: "請輸入比例（例如 16:9）或解析度（例如 1920x1080）。" };
    var m, a, b;
    if ((m = s.match(/^(\d+(?:\.\d+)?)[:\/](\d+(?:\.\d+)?)$/))) {
      a = num(m[1]); b = num(m[2]);
      return ratioResult(a, b, m[1] + ":" + m[2]);
    }
    if ((m = s.match(/^(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)$/i))) {
      a = num(m[1]); b = num(m[2]);
      if (a >= 100 && b >= 100 && Number.isInteger(a) && Number.isInteger(b)) {
        var g = gcd(a, b), rw = a / g, rh = b / g;
        var label = (rw <= 50 && rh <= 50) ? rw + ":" + rh : (a / b).toFixed(2) + ":1";
        return { kind: "res", w: a, h: b, r: a / b, label: label };
      }
      return ratioResult(a, b, m[1] + ":" + m[2]);
    }
    if ((m = s.match(/^(\d+(?:\.\d+)?)$/))) {
      a = num(m[1]);
      if (a >= 100) return { err: "解析度需要寬和高，例如 " + a + "x1080。" };
      return ratioResult(a, 1, m[1] + ":1");
    }
    return { err: "格式看不懂。可以輸入 16:9、2.39、1920x1080。" };
  }
  function ratioResult(a, b, label) {
    if (!(a > 0 && b > 0)) return { err: "數字需要大於 0。" };
    var r = a / b;
    if (r < 0.1 || r > 10) return { err: "這個比例太極端，請輸入 1:10 到 10:1 之間。" };
    return { kind: "ratio", r: r, label: label };
  }

  var srcMode = "auto";

  function autoDevice() {
    var sw = screen.width, sh = screen.height;
    var land = innerWidth > innerHeight;
    var coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    if (coarse && (sw > sh) !== land) { var t = sw; sw = sh; sh = t; }
    return { sw: sw, sh: sh, dpr: window.devicePixelRatio || 1, vw: innerWidth, vh: innerHeight, manual: false };
  }

  function device() {
    var a = autoDevice();
    var msgEl = $("manualMsg");
    if (srcMode !== "manual") { msgEl.textContent = ""; return a; }
    var m = normalize($("scrRes").value).match(/^(\d+)x(\d+)$/i);
    var dpr = num($("scrDpr").value);
    if (!(dpr >= 0.5 && dpr <= 6)) dpr = a.dpr;
    if (!m || +m[1] < 100 || +m[2] < 100) {
      msgEl.textContent = "請輸入原生解析度，例如 2388x1668。目前先用自動偵測的數值。";
      return a;
    }
    msgEl.textContent = "";
    return { sw: +m[1] / dpr, sh: +m[2] / dpr, dpr: dpr, vw: a.vw, vh: a.vh, manual: true };
  }

  function setSrc(m, fill) {
    srcMode = m;
    $("srcAuto").checked = m === "auto";
    $("srcManual").checked = m === "manual";
    $("manualFields").hidden = m !== "manual";
    $("srcHint").textContent = m === "manual"
      ? "用你填的解析度和像素比算出螢幕的 CSS 像素。實際大小預覽仍以目前視窗為準。"
      : "使用瀏覽器回報的螢幕大小和像素比。";
    if (m === "manual" && fill) {
      var a = autoDevice();
      if (!$("scrRes").value) $("scrRes").value = R(a.sw * a.dpr) + "x" + R(a.sh * a.dpr);
      if (!$("scrDpr").value) $("scrDpr").value = Math.round(a.dpr * 100) / 100;
    }
    try {
      localStorage.setItem("aspect-scr", JSON.stringify({ m: m, res: $("scrRes").value, dpr: $("scrDpr").value }));
    } catch (e) {}
  }

  function compute(p, d, eff) {
    var bw, bh;
    if (eff === "native") { bw = p.w / d.dpr; bh = p.h / d.dpr; }
    else { bw = Math.min(d.sw, d.sh * p.r); bh = bw / p.r; }
    return { bw: bw, bh: bh };
  }

  function edgeText(bw, bh, sw, sh) {
    var parts = [], over = false, e = 0.5, g;
    g = (sw - bw) / 2;
    if (g > e) parts.push("左右各留 " + R(g)); else if (g < -e) { parts.push("左右各超出 " + R(-g)); over = true; }
    g = (sh - bh) / 2;
    if (g > e) parts.push("上下各留 " + R(g)); else if (g < -e) { parts.push("上下各超出 " + R(-g)); over = true; }
    return { text: parts.length ? parts.join("，") : "剛好填滿螢幕", over: over };
  }

  function physicalLine(bw, bh, d) {
    var diag = num($("diag").value);
    if (!(diag > 0)) return null;
    var ppi = Math.hypot(d.sw * d.dpr, d.sh * d.dpr) / diag;
    var wi = bw * d.dpr / ppi, hi = bh * d.dpr / ppi;
    var f = function (n) { return (Math.round(n * 10) / 10).toFixed(1); };
    return "約 " + f(wi * 2.54) + " × " + f(hi * 2.54) + " 公分（" + f(wi) + " × " + f(hi) + " 吋）";
  }

  function render() {
    var d = device();
    var raw = $("spec").value;
    var p = parse(raw);
    var msg = $("msg");
    if (p.err) {
      msg.textContent = p.err;
      if (!last) return;
      p = last.p;
    } else {
      msg.textContent = "";
    }
    var isRes = p.kind === "res";
    $("modeNative").disabled = !isRes;
    var eff = (mode === "native" && isRes) ? "native" : "fit";
    $("modeFit").checked = eff === "fit";
    $("modeNative").checked = eff === "native";
    $("modeHint").textContent = isRes
      ? (eff === "native" ? "1 個輸入像素 = 1 個裝置像素，顯示這個解析度在螢幕上實際占多大。" : "把這個比例放大到剛好放進螢幕。")
      : "把這個比例放大到剛好放進螢幕。輸入解析度（如 1920x1080）才能用原始像素。";

    var c = compute(p, d, eff);
    var bw = c.bw, bh = c.bh;
    last = { p: p };

    // 示意圖
    var extW = Math.max(d.sw, bw), extH = Math.max(d.sh, bh);
    var stage = $("stage");
    var availW = Math.max(120, stage.clientWidth - 40);
    var availH = Math.max(220, Math.min(innerHeight * 0.5, 440));
    var k = Math.min(availW / extW, availH / extH);
    var fw = extW * k, fh = extH * k;
    var frame = $("frame");
    frame.style.width = fw + "px";
    frame.style.height = fh + "px";
    var sc = $("screenEl"), bx = $("boxEl");
    sc.style.left = ((extW - d.sw) / 2 * k) + "px";
    sc.style.top = ((extH - d.sh) / 2 * k) + "px";
    sc.style.width = (d.sw * k) + "px";
    sc.style.height = (d.sh * k) + "px";
    bx.style.left = ((extW - bw) / 2 * k) + "px";
    bx.style.top = ((extH - bh) / 2 * k) + "px";
    bx.style.width = (bw * k) + "px";
    bx.style.height = (bh * k) + "px";
    var edge = edgeText(bw, bh, d.sw, d.sh);
    bx.classList.toggle("over", edge.over);
    $("boxLabel").textContent = bw * k > 52 && bh * k > 24 ? p.label : "";

    $("lgScreen").textContent = R(d.sw) + " × " + R(d.sh);
    $("lgBox").textContent = R(bw) + " × " + R(bh);

    // 數值
    var rows = [];
    rows.push(["方框 CSS 像素", R(bw) + " × " + R(bh), true]);
    rows.push(["方框 裝置像素", R(bw * d.dpr) + " × " + R(bh * d.dpr), true]);
    rows.push(["占螢幕", "寬 " + P(bw / d.sw) + " · 高 " + P(bh / d.sh)]);
    rows.push(["占面積", P(Math.min(bw, d.sw) * Math.min(bh, d.sh) / (d.sw * d.sh))]);
    rows.push([edge.over ? "超出螢幕" : "黑邊", edge.text]);
    rows.push(["寬高比", p.r.toFixed(3) + " : 1"]);
    if (isRes && eff === "fit") {
      var sc2 = bw * d.dpr / p.w;
      rows.push(["對照輸入", (sc2 <= 1 ? "縮小為 " : "放大為 ") + P(sc2) + "（" + p.w + "×" + p.h + "）"]);
    }
    var phys = physicalLine(bw, bh, d);
    if (phys) rows.push(["實際尺寸", phys]);
    $("out").innerHTML = rows.map(function (r) {
      return "<div><dt>" + r[0] + "</dt><dd" + (r[2] ? ' class="strong"' : "") + ">" + r[1] + "</dd></div>";
    }).join("");

    // 裝置資訊
    $("device").textContent =
      (d.manual ? "螢幕（手動）" : "螢幕") + " " + R(d.sw) + "×" + R(d.sh) + " CSS 像素 · 像素比 " + (Math.round(d.dpr * 100) / 100) +
      " · 原生 " + R(d.sw * d.dpr) + "×" + R(d.sh * d.dpr) + " · 視窗 " + d.vw + "×" + d.vh;

    markChips(raw);
    last.d = d; last.eff = eff;
  }

  function markChips(raw) {
    var n = normalize(raw).toLowerCase();
    var btns = document.querySelectorAll(".chips button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", normalize(btns[i].dataset.v).toLowerCase() === n ? "true" : "false");
    }
  }

  function buildChips(id, list) {
    var host = $(id);
    list.forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.v = v;
      b.textContent = v.replace("x", "×");
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () {
        $("spec").value = v;
        render();
      });
      host.appendChild(b);
    });
  }

  // 實際大小預覽
  function openOverlay() {
    render();
    if (!last) return;
    var p = last.p, d = autoDevice();
    var vw = innerWidth, vh = innerHeight;
    var w, h, note;
    if (last.eff === "native") {
      w = p.w / d.dpr; h = p.h / d.dpr;
      var s = Math.min(1, vw / w, vh / h);
      if (s < 1) { w *= s; h *= s; note = "這個解析度比視窗大，已縮小為 " + P(s) + " 顯示"; }
      else note = "原始像素大小";
    } else {
      w = Math.min(vw, vh * p.r); h = w / p.r;
      note = "符合視窗的最大方框";
    }
    var ov = $("ovBox");
    ov.style.width = w + "px";
    ov.style.height = h + "px";
    ov.textContent = "";
    var l1 = document.createElement("div"); l1.textContent = p.label;
    var l2 = document.createElement("div"); l2.textContent = R(w) + " × " + R(h) + " CSS 像素";
    ov.appendChild(l1); ov.appendChild(l2);
    $("ovNote").textContent = note + " · 點一下關閉";
    $("overlay").hidden = false;
  }
  function closeOverlay() { $("overlay").hidden = true; }

  // ---- 影片 × 銀幕 ----
  var cfit = "fit";
  var cLast = { f: null, h: null };
  var FILMS = ["1.43", "1.66", "1.85", "1.90", "2.35", "2.39"];
  var HALLS = [
    { v: "1.43", t: "1.43 IMAX" },
    { v: "1.90", t: "1.90 IMAX" },
    { v: "1.85", t: "1.85 Flat" },
    { v: "2.39", t: "2.39 Scope" }
  ];
  var CFIT_HINT = {
    fit: "影片縮放到完整放進銀幕，不裁切，多出的空間是黑邊。",
    fill: "影片放大到蓋滿整個銀幕，超出的部分會被裁掉。",
    width: "影片和銀幕一樣寬。",
    height: "影片和銀幕一樣高。"
  };

  function fr(r) { return (Math.round(r * 100) / 100).toFixed(2); }
  function fn(n) { return String(Math.round(n * 100) / 100); }

  function parseHall(raw) {
    var s = normalize(raw);
    if (!s) return { err: "請輸入銀幕比例（例如 1.85）或寬x高（例如 22x12）。" };
    var m = s.match(/^(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)$/i);
    if (m) {
      var w = num(m[1]), h = num(m[2]);
      if (!(w > 0 && h > 0)) return { err: "寬和高都要大於 0。" };
      var r = w / h;
      if (r < 0.1 || r > 10) return { err: "這個比例太極端，請檢查寬和高。" };
      return { r: r, w: w, h: h, dims: true };
    }
    var p = parse(raw);
    if (p.err) return { err: "格式看不懂。可以輸入 1.85、2.39:1，或銀幕寬x高（例如 22x12）。" };
    return { r: p.r };
  }

  function buildCChips(hostId, items, inputId) {
    var host = $(hostId);
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.v = it.v;
      b.textContent = it.t;
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { $(inputId).value = it.v; renderCinema(); });
      host.appendChild(b);
    });
  }
  function markCChips(hostId, r) {
    var btns = $(hostId).querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", Math.abs(num(btns[i].dataset.v) - r) < 0.0005 ? "true" : "false");
    }
  }

  function renderCinema() {
    var fp = parse($("film").value);
    var hp = parseHall($("hall").value);
    $("filmMsg").textContent = fp.err || "";
    $("hallMsg").textContent = hp.err || "";
    if (fp.err) { fp = cLast.f; } else { cLast.f = fp; }
    if (hp.err) { hp = cLast.h; } else { cLast.h = hp; }
    if (!fp || !hp) return;

    var rf = fp.r, rs = hp.r, hf;
    if (cfit === "fit") hf = Math.min(1, rs / rf);
    else if (cfit === "fill") hf = Math.max(1, rs / rf);
    else if (cfit === "width") hf = rs / rf;
    else hf = 1;
    var wf = hf * rf;

    // 以銀幕高度為 1 的相對尺寸作圖
    var extW = Math.max(rs, wf), extH = Math.max(1, hf);
    var availW = Math.max(120, $("cstage").clientWidth - 48);
    var availH = Math.max(200, Math.min(innerHeight * 0.5, 420));
    var k = Math.min(availW / extW, availH / extH);
    var cf = $("cframe");
    cf.style.width = (extW * k) + "px";
    cf.style.height = (extH * k) + "px";
    function place(el, w, h) {
      el.style.left = ((extW - w) / 2 * k) + "px";
      el.style.top = ((extH - h) / 2 * k) + "px";
      el.style.width = (w * k) + "px";
      el.style.height = (h * k) + "px";
    }
    place($("cScr"), rs, 1);
    place($("cFilm"), wf, hf);
    $("cTagS").textContent = "銀幕 " + fr(rs) + ":1";
    $("cTagS").hidden = !(rs * k > 120 && k > 40);
    $("cTagF").textContent = "影片 " + fr(rf) + ":1";
    $("cTagF").hidden = !(wf * k > 120 && hf * k > 40);

    $("lgHall").textContent = hp.dims ? fn(hp.w) + " × " + fn(hp.h) + "（" + fr(rs) + ":1）" : fr(rs) + ":1";
    $("lgFilm").textContent = fr(rf) + ":1";
    $("cfitHint").textContent = CFIT_HINT[cfit];

    // 數值
    var eps = 0.003;
    var same = Math.abs(rf / rs - 1) < eps;
    var ow = Math.min(wf, rs), oh = Math.min(hf, 1);
    var cover = (ow * oh) / rs;
    var used = (ow * oh) / (wf * hf);
    var barTB = hf < 1 - eps ? (1 - hf) / 2 : 0;
    var barLR = wf < rs * (1 - eps) ? (rs - wf) / 2 / rs : 0;
    var cropLR = wf > rs * (1 + eps) ? (wf - rs) / 2 / wf : 0;
    var cropTB = hf > 1 + eps ? (hf - 1) / 2 / hf : 0;

    var parts = [];
    if (barTB) parts.push("上下各有 " + P(barTB) + " 的黑邊");
    if (barLR) parts.push("左右各有 " + P(barLR) + " 的黑邊");
    if (cropLR) parts.push("左右各被裁掉 " + P(cropLR) + " 的畫面");
    if (cropTB) parts.push("上下各被裁掉 " + P(cropTB) + " 的畫面");
    $("cNote").textContent = same
      ? "比例相同，兩個方框完全重疊。"
      : (rf > rs ? "影片比銀幕更寬。" : "影片比銀幕更接近方形。") + (parts.length ? parts.join("，") + "。" : "");

    var rows = [
      ["影片畫幅", fr(rf) + " : 1", true],
      ["銀幕比例", fr(rs) + " : 1" + (hp.dims ? "（" + fn(hp.w) + " × " + fn(hp.h) + "）" : ""), true],
      ["畫面占銀幕", P(cover) + "（面積）"]
    ];
    if (used < 0.995) rows.push(["看得到的畫面", P(used)]);
    if (barTB) rows.push(["上下黑邊", "各 " + P(barTB) + "（占銀幕高度）"]);
    if (barLR) rows.push(["左右黑邊", "各 " + P(barLR) + "（占銀幕寬度）"]);
    if (cropLR) rows.push(["左右裁切", "各 " + P(cropLR) + "（占畫面寬度）"]);
    if (cropTB) rows.push(["上下裁切", "各 " + P(cropTB) + "（占畫面高度）"]);
    if (hp.dims) rows.push(["畫面實際大小", fn(wf * hp.h) + " × " + fn(hf * hp.h) + "（與銀幕同單位）"]);
    $("cout").innerHTML = rows.map(function (r) {
      return "<div><dt>" + r[0] + "</dt><dd" + (r[2] ? ' class="strong"' : "") + ">" + r[1] + "</dd></div>";
    }).join("");

    markCChips("filmChips", rf);
    markCChips("hallChips", rs);
  }

  function showTab(name) {
    var cin = name === "cinema";
    $("viewScreen").hidden = cin;
    $("viewCinema").hidden = !cin;
    $("tabScreen").setAttribute("aria-current", cin ? "false" : "true");
    $("tabCinema").setAttribute("aria-current", cin ? "true" : "false");
    $("lede").textContent = cin
      ? "選影片畫幅和影廳銀幕，看兩者疊在一起會是什麼樣子。"
      : "輸入比例或解析度，看方框在這台裝置上有多大。";
    if (cin) renderCinema(); else render();
  }

  function initCinema() {
    buildCChips("filmChips", FILMS.map(function (v) { return { v: v, t: v + ":1" }; }), "film");
    buildCChips("hallChips", HALLS, "hall");
    $("film").addEventListener("input", renderCinema);
    $("hall").addEventListener("input", renderCinema);
    document.querySelectorAll('input[name="cfit"]').forEach(function (r) {
      r.addEventListener("change", function () { cfit = r.value; renderCinema(); });
    });
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.addEventListener("click", function () { showTab(b.dataset.tab); });
    });
  }

  buildChips("ratioChips", RATIOS);
  buildChips("resChips", RES);

  $("spec").addEventListener("input", render);
  document.querySelectorAll('input[name="mode"]').forEach(function (r) {
    r.addEventListener("change", function () { mode = r.value; render(); });
  });
  $("diag").addEventListener("input", function () {
    try { localStorage.setItem("aspect-diag", $("diag").value); } catch (e) {}
    render();
  });
  document.querySelectorAll('input[name="src"]').forEach(function (r) {
    r.addEventListener("change", function () { setSrc(r.value, true); render(); });
  });
  ["scrRes", "scrDpr"].forEach(function (id) {
    $(id).addEventListener("input", function () {
      try {
        localStorage.setItem("aspect-scr", JSON.stringify({ m: srcMode, res: $("scrRes").value, dpr: $("scrDpr").value }));
      } catch (e) {}
      render();
    });
  });
  $("openPreview").addEventListener("click", openOverlay);
  $("overlay").addEventListener("click", closeOverlay);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeOverlay(); });
  window.addEventListener("resize", function () {
    if ($("overlay").hidden) { render(); renderCinema(); } else closeOverlay();
  });

  try {
    var saved = localStorage.getItem("aspect-diag");
    if (saved) { $("diag").value = saved; $("physical").open = true; }
  } catch (e) {}

  var restored = false;
  try {
    var scr = JSON.parse(localStorage.getItem("aspect-scr") || "null");
    if (scr && scr.m === "manual") {
      $("scrRes").value = scr.res || "";
      $("scrDpr").value = scr.dpr || "";
      setSrc("manual", true);
      restored = true;
    }
  } catch (e) {}
  if (!restored) setSrc("auto", false);

  initCinema();
  showTab(location.hash === "#cinema" ? "cinema" : "screen");
})();
</script>

</body></html>
